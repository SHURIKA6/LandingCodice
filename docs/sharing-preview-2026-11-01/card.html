<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Codice — composição da prévia de compartilhamento</title>
  <style>
    @font-face {
      font-family: "Bricolage Grotesque";
      src: url("../../public/fonts/study/bricolage-grotesque-latin.woff2") format("woff2");
      font-weight: 200 800;
      font-display: block;
    }
    @font-face {
      font-family: "Source Sans 3";
      src: url("../../public/fonts/source-sans-3-latin-wght-normal.woff2") format("woff2");
      font-weight: 200 900;
      font-display: block;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #f7f9fc; }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #f7f9fc;
      color: #142033;
      font-family: "Source Sans 3", sans-serif;
    }
    /* Keep the content inside the central 630px square for cropped previews. */
    .wordmark {
      position: absolute;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: baseline;
      gap: 13px;
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 104px;
      font-weight: 800;
      letter-spacing: -.07em;
      line-height: 1;
    }
    .wordmark i { width: 19px; height: 19px; background: #2f4bff; }
    h1 {
      position: absolute;
      top: 414px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 500px;
      margin: 0;
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 56px;
      font-weight: 600;
      letter-spacing: -.045em;
      line-height: 1.07;
      text-align: center;
    }
    h1 span { display: block; color: #2f4bff; }
    .sculpture {
      position: absolute;
      top: 170px;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      height: 240px;
      object-fit: contain;
    }
    footer {
      position: absolute;
      bottom: 64px;
      left: 50%;
      transform: translateX(-50%);
      color: #526079;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: .01em;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Codice — sites e sistemas sob medida">
    <div class="wordmark" aria-label="Codice">codice<i aria-hidden="true"></i></div>
    <h1>Sites e sistemas <span>sob medida.</span></h1>
    <img class="sculpture" src="../../public/brand/codice-sculpture-blue.png" width="240" height="240" alt="Escultura azul e cromada de dois Cs entrelaçados." />
    <footer>Sinop, MT</footer>
  </main>
</body>
</html>
